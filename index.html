<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f56d1" />
    <meta name="color-scheme" content="light" />
    <script>/* tema escolhido em Ajustes (padrão: claro), aplicado antes de pintar */try{var t=localStorage.getItem("pf.tema")||"claro";if(t==="escuro"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("escuro")}catch(e){}</script>
    <meta name="description" content="Apta: prova, versão adaptada e gabarito prontos para imprimir, com questões conferidas. Funciona mesmo sem internet." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-title" content="Apta" />
    <title>Apta</title>
  </head>
  <body>
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>
    <header class="topo nao-imprimir">
      <a href="#/" class="marca" aria-label="Apta, ir para o início"><img class="marca-clara" src="/apta-marca.svg" alt="" width="73" height="40" /><img class="marca-escura" src="/apta-marca-escuro.svg" alt="" width="73" height="40" /></a>
      <nav aria-label="Menu principal" class="nav" id="nav"></nav>
      <span id="conexao" class="conexao" role="status"></span>
    </header>
    <main id="conteudo" tabindex="-1"></main>
    <div id="avisos" class="avisos nao-imprimir" aria-live="polite"></div>
    <dialog id="gaveta" class="gaveta" aria-labelledby="gaveta-titulo"></dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
